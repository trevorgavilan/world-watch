<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>World Watch Board</title>
<link rel="stylesheet" href="/static/board.css">
<script src="/static/pins.js" defer></script>
<script src="/static/player.js" defer></script>
<script src="/static/viewer.js" defer></script>
<script src="/static/map.js" defer></script>
<script src="/static/popup.js" defer></script>
<script src="/static/board.js" defer></script>
</head>
<body>
<header class="bar">
  <h1>World Watch</h1>
  <ul id="fresh" class="fresh" aria-label="Sources and when each was last fetched"></ul>
  <p id="fresh-sum" class="fresh-sum"></p>
  <a class="recon" href="/recon">Morning Recon</a>
</header>
<p id="fresh-detail" class="fresh-detail" role="status" hidden></p>
<main id="board" class="board">
  <section id="stage" class="stage" aria-label="Map and globe">
    <div class="tools">
      <div class="seg" role="group" aria-label="View">
        <button id="view-map" type="button" data-key="view:map" aria-pressed="true">Map</button>
        <button id="view-globe" type="button" data-key="view:globe" aria-pressed="false">Globe</button>
      </div>
      <div id="map-tools" class="seg" role="group" aria-label="Map controls">
        <button id="go-world" type="button">World</button>
        <button id="go-mexico" type="button">Mexico</button>
        <button id="go-mideast" type="button">Middle East</button>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
        <button id="zoom-out" type="button" aria-label="Zoom out">&minus;</button>
      </div>
    </div>
    <div id="map" class="map"></div>
    <div id="globe" class="globe" hidden></div>
    <section id="picked" class="popup" role="dialog" aria-label="The picked item" hidden>
      <button id="picked-close" class="popup-close" type="button" aria-label="Close">&times;</button>
      <div id="picked-body"></div>
    </section>
  </section>
  <div id="divider" class="divider" role="separator" tabindex="0" aria-orientation="vertical"
       aria-controls="side" aria-label="Resize the lists"
       title="Drag, or use the arrow keys (Home, End), to share the space; double-click for the default"></div>
  <aside id="side" class="side">
    <section id="live-box" class="box live" aria-label="Middle East live streams" hidden>
      <h2>Middle East live · Medio Oriente en vivo</h2>
      <div id="live-stage" class="live-stage"></div>
      <div class="live-controls">
        <button id="live-prev" type="button" data-key="live:prev" aria-label="Previous stream">&#9664;</button>
        <span id="live-count" class="live-count"></span>
        <button id="live-next" type="button" data-key="live:next" aria-label="Next stream">&#9654;</button>
        <button id="live-console" type="button" data-key="live:console">Open the console &#8599;</button>
      </div>
      <p id="live-title" class="title"></p>
      <p id="live-meta" class="meta"></p>
    </section>
    <section id="layers-box" class="box">
      <h2><button class="fold" type="button" aria-expanded="true">Layers · Capas</button></h2>
      <ul id="layers" class="layers"></ul>
    </section>
    <div id="panels"></div>
  </aside>
</main>
<div id="foot-divider" class="divider across" role="separator" tabindex="0" aria-orientation="horizontal"
     aria-controls="foot" aria-label="Resize the bottom strip"
     title="Drag, or use the arrow keys (Home, End), to resize the bottom strip; double-click for the default"></div>
<footer id="foot" class="foot">
  <p id="status" role="status"></p>
  <ul id="credits" class="credits"></ul>
</footer>
</body>
</html>
